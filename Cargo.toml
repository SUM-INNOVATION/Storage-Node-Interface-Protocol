[workspace]
resolver = "2"
members = [
    "crates/sum-types",
    "crates/sum-net",
    "crates/sum-store",
    "crates/sum-node",
    "crates/sum-crypto",
]

[workspace.package]
version      = "0.4.0-rc4"
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/SUM-INNOVATION/Storage-Node-Interface-Protocol"
rust-version = "1.85"

# ─── Shared Dependencies ──────────────────────────────────────────────────────

[workspace.dependencies]

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde       = { version = "1.0",         features = ["derive"] }
serde_json  = "1.0"
bincode     = { version = "2.0.0-rc.3", features = ["serde"] }
ciborium    = "0.2"

# Error handling
thiserror = "2.0"
anyhow    = "1.0"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# ─── Networking (libp2p) ────────────────────────────────────────────────────

libp2p = { version = "0.55", features = [
    "macros",
    "tokio",
    "noise",
    "yamux",
    "quic",
    "tcp",
    "dns",
    "kad",
    "mdns",
    "gossipsub",
    "identify",
    "autonat",
    "relay",
    "dcutr",
    "request-response",
] }

libp2p-identity = "0.2"
prost           = "0.13"
prost-build     = "0.13"

# ─── Storage ───────────────────────────────────────────────────────────────

memmap2    = "0.9"
blake3     = "1.5"
cid        = "0.11"
multihash  = "0.19"
tempfile   = "3.14"

# Shared consensus-adjacent storage primitives (CHUNK_SIZE + V2
# assignment KDF) published by SUM Chain. Pinned EXACT so SNIP's
# byte-level assignment/chunking domain cannot drift from the chain.
# Converged to 0.3.0 (BR1 beacon + #117 consolidation); the b0 wire
# encoding is frozen, so the vendored b0 corroboration vectors are
# byte-identical to those shipped by wire 0.3.0 (verified in the
# sum-store cross-validation goldens).
sumchain-wire = "=0.4.0"

# ─── Cryptography (sum-crypto) ──────────────────────────────────────────────

# AEAD: ChaCha20-Poly1305 (RFC 8439). Used for per-chunk encryption,
# per-recipient key wrap, and manifest encryption.
chacha20poly1305 = "0.10"
# X25519 ECDH (RFC 7748) for per-recipient key wrapping.
x25519-dalek     = { version = "2.0", default-features = false, features = ["zeroize", "static_secrets"] }
# HKDF-SHA256 (RFC 5869) for chunk-key / chunk-nonce / KEK / manifest-key derivation.
hkdf             = "0.12"
sha2             = "0.10"
# Constant-time comparison primitives (re-exported by AEAD libs but pinned for explicit use).
subtle           = "2.5"
# Zeroize sensitive material on drop.
zeroize          = { version = "1.7", features = ["derive"] }
# CSPRNG for ephemeral key material.
rand_core        = { version = "0.6", features = ["getrandom"] }

# ─── Async Utilities ─────────────────────────────────────────────────────────

futures     = "0.3"
async-trait = "0.1"

# ─── Phase 2: L1 RPC & Transaction ─────────────────────────────────────────

reqwest       = { version = "0.12", features = ["json"] }
bs58          = "0.5"
ed25519-dalek = { version = "2.1", features = ["serde"] }
bincode1      = { package = "bincode", version = "1.3" }
hex             = "0.4"
serde-big-array = "0.5"
lru             = "0.12"

# ─── Utilities ───────────────────────────────────────────────────────────────

bytes   = "1.9"
uuid    = { version = "1.11", features = ["v4"] }
clap    = { version = "4.5",  features = ["derive", "env"] }
rand    = "0.9"
chrono  = { version = "0.4",  features = ["serde"] }

# ─── Internal Crates ─────────────────────────────────────────────────────────

sum-types  = { path = "crates/sum-types" }
sum-net    = { path = "crates/sum-net" }
sum-store  = { path = "crates/sum-store" }
sum-node   = { path = "crates/sum-node" }
sum-crypto = { path = "crates/sum-crypto" }

# ─── Workspace lints ──────────────────────────────────────────────────────────
#
# Project-level lint policy. Crates inherit via `[lints] workspace = true`.
# Behavioral / correctness lints stay at clippy default ("warn"); the
# entries below are deliberate exemptions with stated rationale.
[workspace.lints.clippy]
# `run_*` orchestration entry points (download, ingest, share, etc.)
# take ~8 args by design — chain RPC handle, network handle, key
# material, config, output path, timeout, concurrency cap. Folding
# into a config struct hides the argument list at the cost of a
# larger surface for every test caller. Not worth refactoring; treat
# 7+ args as expected for orchestration.
too_many_arguments = "allow"
# Some test fixtures and bookkeeping types use compound generic types
# (`HashMap<K, Vec<(A, B)>>`) where introducing a type alias would
# obscure the type at the use site. Prefer the explicit form.
type_complexity = "allow"
# Doc comments use a hanging-indent style (continuation lines
# aligned with bullet text) for readability. Clippy's flat 4-space
# form makes multi-line bullets harder to scan in source. The
# rendered output is unaffected.
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"
