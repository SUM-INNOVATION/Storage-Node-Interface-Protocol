<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="ah-p" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#7B2D8E"/></marker>
    <marker id="ah-b" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#0066CC"/></marker>
  </defs>

  <!-- SUMChain box -->
  <rect x="30" y="15" width="420" height="175" rx="8" fill="none" stroke="#7B2D8E" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="240" y="48" text-anchor="middle" fill="#7B2D8E" font-weight="bold" font-size="22">SUMChain</text>
  <ellipse cx="155" cy="115" rx="62" ry="28" fill="#7B2D8E"/>
  <text x="155" y="121" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">Val 1</text>
  <ellipse cx="335" cy="115" rx="62" ry="28" fill="#7B2D8E"/>
  <text x="335" y="121" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">Val 2</text>

  <!-- State callouts inside SUMChain bottom -->
  <text x="55" y="168" fill="#7B2D8E" font-size="11" font-weight="bold">AcceptAssignmentV2:</text>
  <text x="55" y="181" fill="#7B2D8E" font-size="10">OR-merge chunk_indices bitmap</text>
  <text x="270" y="168" fill="#0066CC" font-size="11" font-weight="bold">ActivateFileV2:</text>
  <text x="270" y="181" fill="#0066CC" font-size="10">Pending → Active</text>

  <!-- P2P Mesh box -->
  <rect x="520" y="280" width="520" height="380" rx="8" fill="none" stroke="#CC0000" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="780" y="310" text-anchor="middle" fill="#CC0000" font-weight="bold" font-size="20">P2P Mesh</text>

  <!-- Nodes — assigned archives (N1, N3, N7) highlighted -->
  <rect x="560" y="335" width="58" height="38" rx="4" fill="#CC0000" stroke="#CC0000" stroke-width="2"/><text x="589" y="360" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">N1</text>
  <rect x="660" y="335" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="689" y="360" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N2</text>
  <rect x="760" y="335" width="58" height="38" rx="4" fill="#CC0000" stroke="#CC0000" stroke-width="2"/><text x="789" y="360" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">N3</text>
  <rect x="560" y="415" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="589" y="440" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N4</text>
  <rect x="660" y="415" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="689" y="440" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N5</text>
  <rect x="760" y="415" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="789" y="440" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N6</text>
  <rect x="860" y="415" width="58" height="38" rx="4" fill="#CC0000" stroke="#CC0000" stroke-width="2"/><text x="889" y="440" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">N7</text>
  <rect x="560" y="495" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="589" y="520" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N8</text>
  <rect x="660" y="495" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="689" y="520" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N9</text>
  <rect x="760" y="495" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="789" y="520" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N10</text>

  <!-- Alice (active — submits ActivateFileV2 after coverage poll) -->
  <polygon points="120,515 82,572 158,572" fill="#0066CC" stroke="#0066CC" stroke-width="2"/>
  <text x="120" y="558" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Alice</text>

  <!-- Bob -->
  <polygon points="330,515 292,572 368,572" fill="#fff" stroke="#0066CC" stroke-width="2"/>
  <text x="330" y="558" text-anchor="middle" fill="#0066CC" font-size="14" font-weight="bold">Bob</text>

  <!-- file.pdf -->
  <rect x="175" y="590" width="42" height="52" rx="2" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <path d="M183,603 Q196,600 209,603 M183,611 Q196,608 209,611 M183,619 Q196,616 209,619 M183,627 Q196,624 205,627" fill="none" stroke="#999" stroke-width="1"/>
  <text x="196" y="656" text-anchor="middle" fill="#555" font-size="11">file.pdf</text>

  <!-- AcceptAssignmentV2 attestations: assigned archives -> SUMChain bottom edge -->
  <path d="M589,335 C560,260 460,210 360,190" fill="none" stroke="#7B2D8E" stroke-width="2" marker-end="url(#ah-p)"/>
  <path d="M789,335 C680,240 500,210 385,190" fill="none" stroke="#7B2D8E" stroke-width="2" marker-end="url(#ah-p)"/>
  <path d="M889,415 C780,300 540,220 410,190" fill="none" stroke="#7B2D8E" stroke-width="2" marker-end="url(#ah-p)"/>

  <!-- Alice -> SUMChain (ActivateFileV2 after coverage poll) -->
  <path d="M120,515 C90,400 105,260 145,195" fill="none" stroke="#0066CC" stroke-width="2.5" marker-end="url(#ah-b)"/>

  <!-- Alice's coverage-poll label -->
  <rect x="170" y="425" width="200" height="50" rx="4" fill="#fff" fill-opacity="0.95" stroke="#0066CC" stroke-width="1"/>
  <text x="270" y="441" text-anchor="middle" fill="#0066CC" font-size="11" font-weight="bold">Poll AssignmentCoverageV2</text>
  <text x="270" y="455" text-anchor="middle" fill="#0066CC" font-size="11" font-weight="bold">then ActivateFileV2 tx</text>
  <text x="270" y="469" text-anchor="middle" fill="#666" font-size="9">(when can_activate_now == true)</text>

  <!-- Computation note (lower-right of P2P mesh) -->
  <rect x="830" y="475" width="200" height="175" rx="5" fill="#f0f8ff" stroke="#0066CC" stroke-width="1"/>
  <text x="930" y="493" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Each archive computes</text>
  <text x="930" y="508" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">assignment locally</text>
  <text x="930" y="525" text-anchor="middle" fill="#666" font-size="10">(rendezvous hash):</text>
  <text x="838" y="546" fill="#333" font-size="9" font-family="monospace">key = blake3::derive_key(</text>
  <text x="838" y="558" fill="#333" font-size="9" font-family="monospace">  "sumchain SNIP-V2 ...",</text>
  <text x="838" y="570" fill="#333" font-size="9" font-family="monospace">  merkle_root</text>
  <text x="838" y="582" fill="#333" font-size="9" font-family="monospace">  || chunk_idx_be</text>
  <text x="838" y="594" fill="#333" font-size="9" font-family="monospace">  || archive_addr)</text>
  <text x="838" y="610" fill="#333" font-size="9" font-family="monospace">score = u64(key[..8])</text>
  <text x="930" y="630" text-anchor="middle" fill="#333" font-size="10">Pick R = 3 lowest scores</text>
  <text x="930" y="644" text-anchor="middle" fill="#666" font-size="9">— same algo every party runs</text>

  <!-- Step label -->
  <text x="30" y="695" fill="#333" font-size="13" font-style="italic">Step 4: Assigned archives compute their assignment via rendezvous-hash and attest via AcceptAssignmentV2. Alice polls coverage then submits ActivateFileV2 (Pending → Active). No chunk fetch — Step 3 pushes already landed.</text>
</svg>
