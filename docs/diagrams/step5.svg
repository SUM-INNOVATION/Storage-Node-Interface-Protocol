<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="ah-p" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#7B2D8E"/></marker>
    <marker id="ah-o" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#FF6600"/></marker>
  </defs>

  <!-- SUMChain box -->
  <rect x="30" y="15" width="420" height="175" rx="8" fill="none" stroke="#7B2D8E" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="240" y="48" text-anchor="middle" fill="#7B2D8E" font-weight="bold" font-size="22">SUMChain</text>
  <!-- Val 1 highlighted (generating challenge) -->
  <ellipse cx="155" cy="115" rx="62" ry="28" fill="#5E1D70" stroke="#FFD700" stroke-width="3"/>
  <text x="155" y="121" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">Val 1</text>
  <ellipse cx="335" cy="115" rx="62" ry="28" fill="#7B2D8E"/>
  <text x="335" y="121" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">Val 2</text>

  <!-- StorageChallenge label inside SUMChain bottom -->
  <rect x="55" y="153" width="370" height="32" rx="3" fill="#fff3e6" stroke="#FF6600" stroke-width="1"/>
  <text x="240" y="168" text-anchor="middle" fill="#FF6600" font-size="11" font-weight="bold">StorageChallenge → N2 (prove chunk 7 in 50 blocks)</text>
  <text x="240" y="180" text-anchor="middle" fill="#FF6600" font-size="9">or lose 5% of stake (CHALLENGE_TTL_BLOCKS = 50)</text>

  <!-- P2P Mesh box -->
  <rect x="520" y="280" width="520" height="380" rx="8" fill="none" stroke="#CC0000" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="780" y="310" text-anchor="middle" fill="#CC0000" font-weight="bold" font-size="20">P2P Mesh</text>

  <!-- Nodes — N2 is the target (orange); all others neutral -->
  <rect x="560" y="335" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="589" y="360" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N1</text>
  <rect x="660" y="335" width="58" height="38" rx="4" fill="#FF6600" stroke="#FF6600" stroke-width="2"/><text x="689" y="360" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">N2</text>
  <rect x="760" y="335" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="789" y="360" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N3</text>
  <rect x="560" y="415" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="589" y="440" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N4</text>
  <rect x="660" y="415" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="689" y="440" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N5</text>
  <rect x="760" y="415" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="789" y="440" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N6</text>
  <rect x="860" y="415" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="889" y="440" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N7</text>
  <rect x="560" y="495" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="589" y="520" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N8</text>
  <rect x="660" y="495" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="689" y="520" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N9</text>
  <rect x="760" y="495" width="58" height="38" rx="4" fill="#fff" stroke="#CC0000" stroke-width="2"/><text x="789" y="520" text-anchor="middle" fill="#CC0000" font-size="14" font-weight="bold">N10</text>

  <!-- Alice -->
  <polygon points="120,515 82,572 158,572" fill="#fff" stroke="#0066CC" stroke-width="2"/>
  <text x="120" y="558" text-anchor="middle" fill="#0066CC" font-size="14" font-weight="bold">Alice</text>

  <!-- Bob -->
  <polygon points="330,515 292,572 368,572" fill="#fff" stroke="#0066CC" stroke-width="2"/>
  <text x="330" y="558" text-anchor="middle" fill="#0066CC" font-size="14" font-weight="bold">Bob</text>

  <!-- file.pdf -->
  <rect x="175" y="590" width="42" height="52" rx="2" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <path d="M183,603 Q196,600 209,603 M183,611 Q196,608 209,611 M183,619 Q196,616 209,619 M183,627 Q196,624 205,627" fill="none" stroke="#999" stroke-width="1"/>
  <text x="196" y="656" text-anchor="middle" fill="#555" font-size="11">file.pdf</text>

  <!-- Val1 self-loop (compute) -->
  <path d="M95,105 C60,60 100,50 130,88" fill="none" stroke="#7B2D8E" stroke-width="2" marker-end="url(#ah-p)"/>

  <!-- Challenge generation algorithm box -->
  <rect x="30" y="215" width="290" height="140" rx="5" fill="#f0e6f6" stroke="#7B2D8E" stroke-width="1"/>
  <text x="175" y="233" text-anchor="middle" fill="#7B2D8E" font-size="12" font-weight="bold">Challenge generation (H % 100 == 0):</text>
  <text x="38" y="253" fill="#333" font-size="10" font-family="monospace">seed = blake3(parent_hash ||</text>
  <text x="38" y="265" fill="#333" font-size="10" font-family="monospace">       "storage_challenge" || H_be)</text>
  <text x="38" y="283" fill="#333" font-size="10" font-family="monospace">file   = roots[u64(seed[0..8])  % F]</text>
  <text x="38" y="297" fill="#333" font-size="10" font-family="monospace">chunk  = u32(seed[8..12]) % C    → 7</text>
  <text x="38" y="315" fill="#333" font-size="10" font-family="monospace">target = active[u64(seed[12..20]) % N]</text>
  <text x="38" y="329" fill="#333" font-size="10" font-family="monospace">                            → N2</text>
  <text x="175" y="348" text-anchor="middle" fill="#7B2D8E" font-size="9" font-style="italic">crates/state/src/storage_metadata.rs:734-820</text>

  <!-- Note about target selection scope -->
  <rect x="30" y="365" width="290" height="42" rx="4" fill="#fff3e6" stroke="#FF6600" stroke-width="1"/>
  <text x="175" y="382" text-anchor="middle" fill="#FF6600" font-size="10" font-weight="bold">Target = any active node, not just chunk's R=3.</text>
  <text x="175" y="397" text-anchor="middle" fill="#666" font-size="9">N2 may not be assigned chunk 7 → must fetch from peers.</text>

  <!-- Challenge arrow: SUMChain -> N2 -->
  <path d="M440,190 C500,225 580,275 660,335" fill="none" stroke="#FF6600" stroke-width="2.5" marker-end="url(#ah-o)"/>

  <!-- Step label -->
  <text x="30" y="695" fill="#333" font-size="13" font-style="italic">Step 5: Val 1 generates a PoR challenge during block execution. Target N2 is drawn uniformly from all N=10 active ArchiveNodes — not restricted to chunk 7's R=3 assigned replicas. N2 has 50 blocks to fetch + prove.</text>
</svg>
