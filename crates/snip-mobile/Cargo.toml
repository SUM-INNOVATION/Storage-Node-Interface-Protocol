[package]
name             = "snip-mobile"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "snip_mobile"
# staticlib for the XCFramework slices; cdylib kept for bindgen's
# --library mode which introspects a dylib on the host.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
sum-node   = { path = "../sum-node", default-features = false }
sum-net    = { workspace = true }
sum-store  = { workspace = true }
sum-types  = { workspace = true }
sum-crypto = { workspace = true }
uniffi     = { version = "0.29", features = ["tokio"] }
tokio      = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
anyhow     = { workspace = true }
hex        = { workspace = true }
blake3     = { workspace = true }
zeroize    = { workspace = true }

[dev-dependencies]
tempfile   = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
