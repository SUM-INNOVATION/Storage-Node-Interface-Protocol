[package]
name             = "sum-node"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sum-node"
path = "src/main.rs"

[[bin]]
name = "e2e-helper"
path = "src/bin/e2e_helper.rs"

[features]
default = ["mdns"]
mdns = ["sum-net/mdns", "sum-store/mdns"]

[dependencies]
sum-types          = { workspace = true }
sum-net            = { workspace = true }
sum-store          = { workspace = true }
sum-crypto         = { workspace = true }
tokio              = { workspace = true }
clap               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
blake3             = { workspace = true }
reqwest            = { workspace = true }
bs58               = { workspace = true }
ed25519-dalek      = { workspace = true }
bincode1           = { workspace = true }
hex                = { workspace = true }
serde-big-array    = { workspace = true }
async-trait        = { workspace = true }
ciborium           = { workspace = true }
lru                = { workspace = true }
memmap2            = { workspace = true }
tempfile           = { workspace = true }
rand_core          = { workspace = true }
zeroize            = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Minimal HTTP mock server for wire-shape regression tests. Used only
# by the e2e_helper `smoke` subcommand tests to drive the actual HTTP
# code path against scripted JSON responses.
httpmock = "0.7"

[lints]
workspace = true
